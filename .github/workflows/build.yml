name: Build
on:
  push:
    branches: [ main ]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
        - os: ubuntu-22.04
          name: ducky-clock-linux
        - os: windows-latest
          name: ducky-clock-windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - run: pip install -r requirements.txt

      - run: pyinstaller --onefile --windowed --name ${{ matrix.name }} duck.py

      - uses: actions/upload-artifact@v4
        with:
            name: ${{ matrix.name }}
            path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true